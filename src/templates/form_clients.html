<form>
  <div class="mb-3">
    <label for="name" class="form-label">Name</label>
    <input type="text" class="form-control" id="name" aria-describedby="emailHelp">
    <div id="nameHelp" class="form-text">Write your full name.</div>
  </div>
   <div class="mb-3">
    <label for="idType" class="form-label">Type identification</label>
        <select class="form-select" aria-label="Default select example">
        <option selected>Select your identification Type </option>
        <option value="1">TI</option>
        <option value="2">CC</option>
        <option value="3">CE</option>
        <option value="3">PAS</option>
        </select>
    <div id="idTypeHelp" class="form_text">write your identification Number.</div>
    </div>
    <div class="mb-3">
    <label for="idNumber" class="form-label">Identification Number</label>
    <input type="text" class="form-control" id="idNumber" aria-describedby="idNumberHelp" placeholder="123456789">
    <div id="idNumberHelp" class="form-text">Write your identification Number.</div>
  </div>
   <div class="mb-3">
    <label for="address" class="form-label">Address</label>
    <input type="text" class="form-control" id="address" aria-describedby="emailHelp" placeholder="Cra 15 2 CS# 111">
    <div id="addressHelp" class="form-text">Write your home address. </div>
  </div>
 <div class="mb-3">
    <label for="exampleInputEmail1" class="form-label">Email address</label>
    <input type="email" class="form-control" id="exampleInputEmail1" aria-describedby="emailHelp">
    <div id="emailHelp" class="form-text">We'll never share your email with anyone else.</div>
  </div>
  <div class="mb-3">
    <label for="phone" class="form-label">Phone</label>
    <input type="text" class="form-control" id="phone">
  </div>
  <div class="mb-3 form-check">
    <input type="checkbox" class="form-check-input" id="exampleCheck1">
    <label class="form-check-label" for="exampleCheck1">Check me out</label>
  </div>
  <button type="submit" class="btn btn-primary">Submit</button>
</form>
